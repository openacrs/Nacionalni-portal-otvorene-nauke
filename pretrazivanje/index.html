<!DOCTYPE html>
<html lang="sr-Latn"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Pretraživanje | open.ac.rs</title><link href="../assets/css/site.css" rel="stylesheet"/><link href="../images/favicon-16x16.png" rel="icon"/></head><body><header id="site-header"></header><main class="content"><h1>Pretraživanje</h1><div class="search-box"><input id="q" placeholder="Unesite pojam" type="search"/><button id="go">Pretraži</button></div><div id="results"></div></main><footer id="site-footer"></footer><script>let idx=[];fetch('../assets/search-index.json').then(r=>r.json()).then(d=>idx=d);function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function run(){const q=document.getElementById('q').value.toLowerCase().trim(),r=document.getElementById('results');if(!q){r.innerHTML='';return}const m=idx.filter(x=>(x.title+' '+x.text).toLowerCase().includes(q)).slice(0,100);r.innerHTML=m.length?m.map(x=>`<div class="search-result"><a href="../${x.url.replace(/^\//,'')}">${esc(x.title)}</a><p>${esc(x.text)}</p></div>`).join(''):'<p>Nema rezultata.</p>'}document.getElementById('go').onclick=run;document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')run()});</script><script src="../assets/js/menu.js"></script></body></html>
